name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set environment variables
        run: echo "MY_API_KEY=${{ secrets.API_KEY }}" >> $GITHUB_ENV

      - name: Deploy or run script
        run: node scripts/scripts.js
